name: kqw_app
description: 超级展业系统 C 端商户 App（POS 展业 / 积分商城 / 7 人团队 / 任务中心）
publish_to: "none"
# 发版必须递增 build number（`+N` → Android versionCode），App 更新提示按它比较
version: 0.1.7+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.5.0
  provider: ^6.1.2
  go_router: ^14.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  gal: ^2.3.3
  mobile_scanner: ^7.4.2
  # 读取本地安装版本（versionName/versionCode），用于与后端最新版本比较
  package_info_plus: ^8.1.0
  # 更新提示里打开 APK 下载地址（外部浏览器）
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/carousel/
    - assets/guide/
